<script>
  // 开发/截图辅助：?p=0.45 直接把滚动定位到 45%；?still=0.7 不滚动、钉在某一进度
  window.__DSH_PARAMS = new URLSearchParams(location.search);
  window.addEventListener('error', function (e) {
    var el = document.getElementById('errlog');

    el.hidden = false;
